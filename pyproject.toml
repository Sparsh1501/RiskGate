[project]
name = "riskgate"
version = "0.1.0"
description = "Real-time payment risk scoring platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.4.2,<2",
    "kagglehub>=0.3.6,<1",
    "mlflow>=2.17.0,<3",
    "numpy>=2.1.0,<3",
    "pandas>=2.2.3,<3",
    "pyarrow>=18.0.0,<19",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "scikit-learn>=1.5.2,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0,<2",
    "pandas-stubs>=2.2.3.241009,<3",
    "pytest>=8.3.0,<9",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.8.0,<1",
    "types-requests>=2.32.0.20241016,<3",
]

[project.scripts]
riskgate-download = "riskgate.data.download:main"
riskgate-train-baseline = "riskgate.training.train_baseline:main"
riskgate-eval = "riskgate.evaluation.run_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskgate"]

[tool.hatch.build.targets.sdist]
include = ["src/riskgate", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "mlflow.*", "kagglehub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
